
<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Student Management System</h2>

    <form id="studentForm">

    <h3>Student Details</h3>
    <ul id="list"></ul>

    <script src="script.js"></script>
</body>
</html>
